<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P.OYUUK – Pre-Order Makanan UMKM</title>
<style>
:root{--bg:#FFFAF2;--card:#fff;--tx:#2A1B1E;--mu:#7A6A6D;--ac:#9E2336;--acd:#7F1A2B;--on:#fff;--bd:#EFE3D1;--soft:#FBF1E3;--ok:#2E7D4F;--er:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100vh;padding-bottom:84px;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bd)}
.logo{width:38px;height:38px;border-radius:11px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
header b{font-size:18px;letter-spacing:1.2px;color:var(--ac);display:block;line-height:1.2}
header small{color:var(--mu);font-size:12px}
main{padding:20px}
h2{font-size:20px;line-height:1.3}
.sub{color:var(--mu);font-size:13px;margin-top:4px}
.srch{position:relative;margin-top:16px}
.srch svg{position:absolute;left:14px;top:14px;width:20px;height:20px;stroke:var(--ac);fill:none;stroke-width:2}
.srch input{width:100%;padding:14px 14px 14px 44px;border:1.5px solid var(--bd);border-radius:14px;font:inherit;background:var(--card);color:var(--tx);box-shadow:0 2px 10px rgba(80,30,30,.06)}
.srch input:focus{outline:0;border-color:var(--ac)}
#sug{position:absolute;left:0;right:0;top:56px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px rgba(60,20,20,.14);z-index:6;overflow:hidden}
#sug div{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--bd)}
#sug div:last-child{border:0}#sug div:hover{background:var(--soft)}
#sug b{display:block;font-size:14px}#sug span{font-size:12px;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;color:var(--ac);font-size:16px}.stat span{font-size:11px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px 0 4px;padding-bottom:4px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:22px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.loc{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin-top:16px}
.loc b{display:block}.loc span{font-size:12px;color:var(--mu)}
.sec{font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;gap:14px;margin-bottom:14px;cursor:pointer;box-shadow:0 2px 8px rgba(60,30,30,.06)}
.card.off{opacity:.55;cursor:default;box-shadow:none}
.em{width:76px;height:76px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:38px;flex:none}
.card h3{font-size:15px;line-height:1.3}.card p{font-size:13px;color:var(--mu);margin-top:2px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;background:var(--soft);color:var(--acd);padding:3px 9px;border-radius:10px;font-weight:600}
.price{color:var(--ac);font-weight:700;margin-top:8px;font-size:15px}.price small{color:var(--mu);font-weight:400;font-size:12px}
.empty{text-align:center;color:var(--mu);padding:36px 12px;background:var(--card);border:1px dashed var(--bd);border-radius:16px;margin-top:18px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:6px}
.ghost{border:1px solid var(--ac);color:var(--ac);background:none;border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
nav{position:fixed;bottom:0;width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:14px;border:0;background:none;color:var(--mu);font:inherit;font-size:13px;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--ac);font-weight:700;border-top-color:var(--ac)}
.bg{position:fixed;inset:0;background:rgba(30,10,14,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px 26px}
.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:12px}
label{font-size:13px;color:var(--mu);display:block;margin:16px 0 6px;font-weight:600}
.f{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
.f:focus{outline:0;border-color:var(--ac)}
.step{display:flex;align-items:center;gap:16px}
.step button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ac);background:none;color:var(--ac);font-size:20px;cursor:pointer}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-top:20px}
.sum .row{margin:6px 0;font-size:14px}
.tot{font-weight:700;font-size:16px;border-top:1px dashed var(--bd);padding-top:10px;margin-top:10px!important}
.btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.x{float:right;background:var(--soft);border:0;width:32px;height:32px;border-radius:50%;color:var(--mu);font-size:18px;cursor:pointer}
.ok{color:var(--ok);font-size:13px}
.st{font-size:11px;padding:4px 10px;border-radius:10px;background:var(--soft);color:var(--acd);font-weight:700;white-space:nowrap}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;z-index:20;display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
var MAXKM=10,RATE=2500,MINDAY=2,ROAD=1.25;
var G=[
{n:"UKSW Kampus Diponegoro",a:"Jl. Diponegoro 52–60, Salatiga",la:-7.3318,lo:110.5051,k:"uksw satya wacana diponegoro kampus"},
{n:"FTI UKSW",a:"Fakultas Teknologi Informasi, Blotongan, Salatiga",la:-7.3469,lo:110.4936,k:"uksw fti teknologi informasi blotongan satya wacana"},
{n:"Alun-alun Pancasila",a:"Pusat Kota Salatiga",la:-7.3306,lo:110.5085,k:"alun alun pusat kota"},
{n:"Pasar Raya Salatiga",a:"Jl. Jend. Sudirman, Salatiga",la:-7.3322,lo:110.5072,k:"pasar sudirman"},
{n:"Stasiun Salatiga",a:"Kota Salatiga",la:-7.3290,lo:110.5018,k:"stasiun kereta"},
{n:"Terminal Tingkir",a:"Tingkir, Salatiga",la:-7.3535,lo:110.5008,k:"terminal bus tingkir"},
{n:"IAIN Salatiga",a:"Jl. Lingkar Salatiga",la:-7.3195,lo:110.4930,k:"iain kampus"},
{n:"Ungaran Kota",a:"Kab. Semarang (di luar jangkauan UMKM Salatiga)",la:-7.1397,lo:110.4065,k:"ungaran semarang"}];
var P=[
{id:1,n:"Brownies Panggang Bu Rini",v:"Dapur Bu Rini",ar:"Kauman Kidul",c:"Kue",e:"🍫",p:45000,u:"loyang",la:-7.3365,lo:110.5040,d:"Brownies fudgy tanpa pengawet."},
{id:2,n:"Nasi Tumpeng Mini",v:"Warung Mbak Sari",ar:"Sidorejo",c:"Nasi",e:"🍚",p:35000,u:"box",la:-7.3180,lo:110.5210,d:"Cocok untuk syukuran dan arisan."},
{id:3,n:"Kue Lapis Legit",v:"Legit Nenek",ar:"Tingkir",c:"Kue",e:"🍰",p:120000,u:"loyang",la:-7.3520,lo:110.4980,d:"Lapis butter premium, 18 lapis."},
{id:4,n:"Nasi Kotak Ayam Bakar",v:"Katering Pak Joko",ar:"Blotongan",c:"Nasi",e:"🍱",p:28000,u:"box",la:-7.3440,lo:110.4900,d:"Cocok untuk acara kampus dan rapat."},
{id:5,n:"Keripik Tempe Sagu",v:"Camilan Ibu Eni",ar:"Argomulyo",c:"Camilan",e:"🥔",p:18000,u:"toples",la:-7.3600,lo:110.5120,d:"Renyah, gurih, tanpa MSG."},
{id:6,n:"Es Teh Susu Gula Aren 1L",v:"Seduh Kita",ar:"Mangunsari",c:"Minuman",e:"🧋",p:30000,u:"botol",la:-7.3250,lo:110.5100,d:"Dibuat fresh H-1 pengiriman."},
{id:7,n:"Roti Sobek Isi Cokelat",v:"Roti Pak Dhe",ar:"Tengaran",c:"Kue",e:"🍞",p:25000,u:"pcs",la:-7.4040,lo:110.5180,d:"Lembut, dipanggang pagi hari."},
{id:8,n:"Kopi Susu Botol 500ml",v:"Kedai Ambarawa",ar:"Ambarawa",c:"Minuman",e:"☕",p:22000,u:"botol",la:-7.2640,lo:110.4040,d:"Kopi lokal Kopeng, manis pas."}];
var S={tab:"home",cat:"Semua",loc:null,sel:null,orders:[],q:1,date:"",addr:"",note:""};
var rp=function(n){return "Rp"+Math.round(n).toLocaleString("id-ID")};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var $=function(i){return document.getElementById(i)};
function hv(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 12742*Math.asin(Math.sqrt(h))}
function dist(p){return Math.round(hv(S.loc.la,S.loc.lo,p.la,p.lo)*ROAD*10)/10}
function km(x){return x.toFixed(1).replace(".",",")}
function og(k){return Math.ceil(k*RATE/100)*100}
function minDate(){var d=new Date();d.setDate(d.getDate()+MINDAY);var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function fmt(s){return new Date(s+"T00:00:00").toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},2400)}

function render(){
 var h='<header><div class="logo">P</div><div><b>P.OYUUK</b><small>Pre-order makanan UMKM, antar ke lokasimu</small></div></header><main>';
 if(S.tab==="home"){
  h+='<h2>Cari UMKM di sekitarmu</h2><p class="sub">Masukkan lokasi antar, kami tampilkan UMKM dalam radius '+MAXKM+' km.</p>';
  h+='<div class="srch"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><input id="si" autocomplete="off" placeholder="Contoh: UKSW Diponegoro, FTI UKSW" value="'+(S.loc?esc(S.loc.n):"")+'" oninput="sug(this.value)" onfocus="sug(this.value)"><div id="sug" style="display:none"></div></div>';
  h+='<div class="stats"><div class="stat"><b>H-'+MINDAY+'</b><span>Minimal PO</span></div><div class="stat"><b>'+MAXKM+' km</b><span>Radius antar</span></div><div class="stat"><b>'+rp(RATE)+'</b><span>Ongkir per km</span></div></div>';
  if(!S.loc){
   h+='<div class="empty"><b>Pilih lokasi antar dulu</b>Ketik nama tempat di atas, atau pilih cepat:<div class="chips" style="justify-content:center;flex-wrap:wrap;margin-bottom:0">'+[0,1,2,3].map(function(i){return '<button class="chip" onclick="pick('+i+')">'+G[i].n+'</button>'}).join("")+'</div></div>';
  } else {
   var all=P.map(function(p){return{p:p,k:dist(p)}}).sort(function(a,b){return a.k-b.k});
   var inn=all.filter(function(x){return x.k<=MAXKM&&(S.cat==="Semua"||x.p.c===S.cat)}),out=all.filter(function(x){return x.k>MAXKM});
   h+='<div class="loc"><div><b>📍 '+S.loc.n+'</b><span>'+S.loc.a+'</span></div><button class="ghost" onclick="S.loc=null;render()">Ubah</button></div>';
   h+='<div class="chips">'+["Semua","Nasi","Kue","Camilan","Minuman"].map(function(c){return '<button class="chip'+(S.cat===c?' on':'')+'" onclick="S.cat=\''+c+'\';render()">'+c+'</button>'}).join("")+'</div>';
   h+='<div class="sec" style="margin-top:8px">'+inn.length+' UMKM dalam jangkauan</div>';
   if(!inn.length)h+='<div class="empty">Belum ada UMKM untuk kategori ini di sekitar lokasimu.</div>';
   inn.forEach(function(x){var p=x.p;
    h+='<div class="card" onclick="openP('+p.id+')"><div class="em">'+p.e+'</div><div style="flex:1"><h3>'+p.n+'</h3><p>'+p.v+' · '+p.ar+'</p><div class="meta"><span class="tag">📍 '+km(x.k)+' km</span><span class="tag">Ongkir '+rp(og(x.k))+'</span><span class="tag">PO H-'+MINDAY+'</span></div><div class="price">'+rp(p.p)+' <small>/ '+p.u+'</small></div></div></div>'});
   if(out.length){h+='<div class="sec">Di luar jangkauan (&gt;'+MAXKM+' km)</div>';
    out.forEach(function(x){var p=x.p;h+='<div class="card off"><div class="em">'+p.e+'</div><div><h3>'+p.n+'</h3><p>'+p.v+' · '+p.ar+'</p><div class="meta"><span class="tag">'+km(x.k)+' km, tidak bisa dipesan</span></div></div></div>'})}
  }
 } else {
  h+='<h2>Pesanan Saya</h2><div style="height:14px"></div>';
  if(!S.orders.length)h+='<div class="empty"><b>Belum ada pesanan</b>Yuk pre-order makanan favoritmu!</div>';
  S.orders.slice().reverse().forEach(function(o){
   h+='<div class="card" style="cursor:default;flex-direction:column;gap:6px"><div class="row" style="margin:0;align-items:flex-start"><b>'+o.e+' '+o.n+'</b><span class="st">Menunggu konfirmasi</span></div><p>'+o.q+' × '+rp(o.p)+' · '+km(o.km)+' km</p><p>📅 Antar: '+fmt(o.date)+'</p><p>📍 '+esc(o.loc)+' – '+esc(o.addr)+'</p><div class="row" style="margin:4px 0 0"><span>Total</span><b class="price" style="margin:0">'+rp(o.total)+'</b></div></div>'});
 }
 h+='</main><nav><button class="'+(S.tab==="home"?"on":"")+'" onclick="S.tab=\'home\';render()">Beranda</button><button class="'+(S.tab==="ord"?"on":"")+'" onclick="S.tab=\'ord\';render()">Pesanan'+(S.orders.length?' ('+S.orders.length+')':'')+'</button></nav>';
 if(S.sel)h+=sheet();
 $("app").innerHTML=h;if(S.sel)upd();
}
function sug(q){
 var t=q.toLowerCase().split(/\s+/).filter(Boolean),el=$("sug"),r=[];
 G.forEach(function(g,i){var s=(g.n+" "+g.k).toLowerCase();if(t.every(function(w){return s.indexOf(w)>-1}))r.push(i)});
 if(!t.length)r=[0,1,2,3,4];
 el.style.display="block";
 el.innerHTML=r.length?r.slice(0,6).map(function(i){return '<div onclick="pick('+i+')"><b>📍 '+G[i].n+'</b><span>'+G[i].a+'</span></div>'}).join(""):'<div><b>Lokasi tidak ditemukan</b><span>Coba: UKSW Diponegoro, FTI UKSW, Alun-alun Pancasila</span></div>';
}
document.addEventListener("click",function(e){var s=$("sug");if(s&&!e.target.closest(".srch"))s.style.display="none"});
function pick(i){S.loc=G[i];render()}
function openP(id){S.sel=P.find(function(p){return p.id===id});S.q=1;S.date="";S.addr="";S.note="";render()}
function closeP(){S.sel=null;render()}
function sheet(){var p=S.sel,k=dist(p);
 return '<div class="bg" onclick="if(event.target===this)closeP()"><div class="sheet"><button class="x" onclick="closeP()">×</button>'+
 '<div class="row" style="justify-content:flex-start;gap:14px;margin-top:0"><div class="em">'+p.e+'</div><div><b style="font-size:16px">'+p.n+'</b><p class="sub">'+p.v+' · '+p.ar+'</p><p class="sub">'+p.d+'</p></div></div>'+
 '<div class="row" style="margin-top:20px"><b>Jumlah</b><div class="step"><button onclick="S.q=Math.max(1,S.q-1);upd()">−</button><b id="q">1</b><button onclick="S.q++;upd()">+</button></div></div>'+
 '<label>Tanggal pengantaran (minimal H-'+MINDAY+')</label><input class="f" type="date" id="dt" min="'+minDate()+'" onchange="S.date=this.value;upd()">'+
 '<label>Lokasi antar</label><div class="loc" style="margin:0"><div><b>'+S.loc.n+'</b><span>Jarak ±'+km(k)+' km dari penjual</span></div><span class="ok">✓ Dalam jangkauan</span></div>'+
 '<label>Detail alamat (gedung, ruang, patokan)</label><input class="f" id="ad" placeholder="Contoh: Gedung FTI lantai 2, ruang 204" oninput="S.addr=this.value;upd()">'+
 '<label>Catatan untuk penjual (opsional)</label><input class="f" id="nt" placeholder="Tanpa kacang, tulisan di kue, dll." oninput="S.note=this.value">'+
 '<div class="sum"><div class="row"><span>Subtotal</span><span id="s1"></span></div><div class="row"><span>Ongkir ('+km(k)+' km × '+rp(RATE)+')</span><span>'+rp(og(k))+'</span></div><div class="row tot"><span>Total</span><span id="s3" class="price" style="margin:0"></span></div></div>'+
 '<button class="btn" id="go" onclick="order()">Pesan Pre-Order</button></div></div>'}
function valid(){return S.date&&S.date>=minDate()&&S.addr.trim().length>3}
function upd(){var p=S.sel,k=dist(p);$("q").textContent=S.q;$("s1").textContent=rp(p.p*S.q);$("s3").textContent=rp(p.p*S.q+og(k));$("go").disabled=!valid()}
function order(){if(!valid())return;var p=S.sel,k=dist(p);
 S.orders.push({n:p.n,e:p.e,p:p.p,q:S.q,km:k,date:S.date,addr:S.addr,loc:S.loc.n,total:p.p*S.q+og(k)});
 S.sel=null;S.tab="ord";render();toast("Pesanan terkirim ke penjual ✓")}
render();
</script>
</body>
</html>
